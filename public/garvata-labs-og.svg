<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f" />
      <stop offset="1" stop-color="#0b2236" />
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(250 315) rotate(90) scale(360)">
      <stop offset="0" stop-color="#0e7490" stop-opacity=".28" />
      <stop offset="1" stop-color="#0e7490" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000814" flood-opacity=".3" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#background)" />
  <rect width="1200" height="630" fill="url(#glow)" />
  <path d="M0 1h1200" stroke="#38bdf8" stroke-opacity=".55" stroke-width="2" />

  <g filter="url(#shadow)">
    <rect x="112" y="155" width="320" height="320" rx="64" fill="#f8fafc" />
    <image href="logo.png" x="167" y="210" width="210" height="210" preserveAspectRatio="xMidYMid meet" />
  </g>

  <text
    x="500"
    y="343"
    fill="#f8fafc"
    font-family="Outfit, Helvetica Neue, Helvetica, Arial, sans-serif"
    font-size="82"
    font-weight="800"
    letter-spacing="-2"
  >Garvata Labs</text>
</svg>
